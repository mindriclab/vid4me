<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Vid4me – Ersteinrichtung</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0f14; color: #e6e9f0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .box { text-align: center; max-width: 560px; padding: 24px; }
    #log {
      width: min(720px, 90vw); height: 240px; overflow-y: auto;
      background: #0f131c; border: 1px solid #262c3b; border-radius: 10px;
      padding: 10px 14px; margin-top: 8px;
      font-family: Consolas, monospace; font-size: 12px; color: #8b93a7;
      text-align: left; white-space: pre-wrap; word-break: break-word;
    }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 20px;
      border: 4px solid #262c3b; border-top-color: #6c8cff;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #8b93a7; font-size: 14px; line-height: 1.5; }
    code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Vid4me wird eingerichtet…</h1>
    <p>
      Die Python-Umgebung wird jetzt einmalig installiert (PyTorch + Diffusers, ~3&nbsp;GB Download).
      Das kann einige Minuten dauern.
    </p>
    <p>Die App startet automatisch, sobald die Einrichtung abgeschlossen ist.</p>
  </div>
  <pre id="log">Warte auf Setup-Ausgabe…</pre>
  <script>
    const log = document.getElementById("log");
    let first = true;
    if (window.vid4me?.onSetupLog) {
      window.vid4me.onSetupLog((line) => {
        if (first) { log.textContent = ""; first = false; }
        log.textContent += line;
        log.scrollTop = log.scrollHeight;
      });
    }
  </script>
</body>
</html>
